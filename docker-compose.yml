version: '3'
services:
  web:
    image: ubuntu:latest
    container_name: my-web-container
    command: tail -f /dev/null # Keeps the container running
    volumes:
      - ./code:/var/www/html
      - ./logs:/var/log/apache2
    ports:
      - "80:80"
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:latest
    container_name: my-db-container
    environment:
      MYSQL_DATABASE: my_database
      MYSQL_ROOT_PASSWORD: my_root_password
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: my-phpmyadmin-container
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: my_root_password
    ports:
      - "8080:80"
    restart: always

  cron:
    image: ubuntu:latest
    container_name: my-cron-container
    volumes:
      - ./code:/var/www/html
      - ./logs:/var/log/apache2
    command: /bin/bash -c "apt-get update && apt-get -y install git && while true; do sleep 86400 && cd /var/www/html && git pull && /etc/init.d/apache2 reload; done"
    restart: always
