version: "3"

services:
  php:
    build: .
    ports:
      - "80:80"
      - "3306:3306"
    volumes:
      - ./html:/var/www/html/
    environment:
      MYSQL_ROOT_PASSWORD: your_password
    depends_on:
      - mysql
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: your_password
    volumes:
      - ./db:/var/lib/mysql
